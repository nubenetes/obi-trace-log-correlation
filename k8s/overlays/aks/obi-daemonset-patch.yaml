apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
  namespace: obi
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - effect: "NoSchedule"
          key: "node-role.kubernetes.io/master"
          operator: "Exists"
