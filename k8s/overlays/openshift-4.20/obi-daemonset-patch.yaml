apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
  namespace: obi
spec:
  template:
    spec:
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/infra
          operator: Exists
          effect: NoSchedule
      containers:
        - name: obi
          securityContext:
            privileged: true
            seLinuxOptions:
              type: spc_t
