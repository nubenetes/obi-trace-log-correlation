apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi-agent
  namespace: obi
  labels:
    app.kubernetes.io/name: obi
    app.kubernetes.io/component: ebpf-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi-agent-role
  labels:
    app.kubernetes.io/name: obi
rules:
  # Permissions to discover and enrich telemetry with Kubernetes metadata
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi-agent-binding
  labels:
    app.kubernetes.io/name: obi
subjects:
  - kind: ServiceAccount
    name: obi-agent
    namespace: obi
roleRef:
  kind: ClusterRole
  name: obi-agent-role
  apiGroup: rbac.authorization.k8s.io
