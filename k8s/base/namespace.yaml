apiVersion: v1
kind: Namespace
metadata:
  name: obi
  labels:
    app.kubernetes.io/part-of: opentelemetry-ebpf
    # Enforce Privileged Pod Security Standard as OBI requires hostPID and eBPF capabilities
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
  labels:
    app.kubernetes.io/part-of: obi-trace-log-demo
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
